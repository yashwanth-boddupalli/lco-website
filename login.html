<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Tiranga Cable TV & Internet</title>
  <meta name="description"
    content="Login to your Tiranga Cable TV & Internet account to manage your services, view billing, and access support.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    /* ============================================================
       DESIGN TOKENS (matching Tiranga branding)
    ============================================================ */
    :root {
      --navy: #0A1628;
      --royal: #1E4DB7;
      --royal-light: #2563EB;
      --royal-pale: #EFF6FF;
      --accent: #F97316;
      --accent-pale: #FFF7ED;
      --green: #16A34A;
      --green-pale: #F0FDF4;
      --red: #DC2626;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --text-mid: #475569;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .08), 0 1px 2px rgba(0, 0, 0, .04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, .08), 0 2px 4px rgba(0, 0, 0, .04);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, .10), 0 4px 8px rgba(0, 0, 0, .05);
      --shadow-xl: 0 20px 60px rgba(0, 0, 0, .12), 0 8px 16px rgba(0, 0, 0, .06);
      --radius: 14px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --transition: 0.22s cubic-bezier(.4, 0, .2, 1);
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: var(--navy);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      background: none;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ============================================================
       BACKGROUND DECORATION
    ============================================================ */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 70%;
      height: 160%;
      background: radial-gradient(ellipse, rgba(30, 77, 183, .25) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      left: -20%;
      width: 60%;
      height: 140%;
      background: radial-gradient(ellipse, rgba(249, 115, 22, .10) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Floating particles */
    .bg-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-particles span {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, .06);
      border-radius: 50%;
      animation: float-particle linear infinite;
    }

    .bg-particles span:nth-child(1) {
      left: 10%;
      top: 20%;
      animation-duration: 18s;
      animation-delay: 0s;
      width: 3px;
      height: 3px;
    }

    .bg-particles span:nth-child(2) {
      left: 25%;
      top: 60%;
      animation-duration: 22s;
      animation-delay: 2s;
      width: 5px;
      height: 5px;
    }

    .bg-particles span:nth-child(3) {
      left: 50%;
      top: 10%;
      animation-duration: 15s;
      animation-delay: 4s;
      width: 3px;
      height: 3px;
    }

    .bg-particles span:nth-child(4) {
      left: 70%;
      top: 40%;
      animation-duration: 20s;
      animation-delay: 1s;
      width: 6px;
      height: 6px;
    }

    .bg-particles span:nth-child(5) {
      left: 85%;
      top: 70%;
      animation-duration: 25s;
      animation-delay: 3s;
      width: 4px;
      height: 4px;
    }

    .bg-particles span:nth-child(6) {
      left: 40%;
      top: 80%;
      animation-duration: 17s;
      animation-delay: 5s;
      width: 3px;
      height: 3px;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateY(-100vh) translateX(40px);
        opacity: 0;
      }
    }

    /* ============================================================
       LOGIN CONTAINER
    ============================================================ */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      animation: slide-up 0.5s cubic-bezier(.4, 0, .2, 1) both;
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================================
       LOGO
    ============================================================ */
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .login-logo-icon {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, .1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .login-logo-text {
      text-align: left;
    }

    .login-logo-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .login-logo-sub {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, .5);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ============================================================
       LOGIN CARD
    ============================================================ */
    .login-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
      border: 1px solid rgba(255, 255, 255, .08);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--royal), var(--accent));
    }

    .login-card-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .login-card-sub {
      font-size: 0.9rem;
      color: var(--text-mid);
      margin-bottom: 32px;
    }

    /* ============================================================
       FORM ELEMENTS
    ============================================================ */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .form-input-wrap {
      position: relative;
    }

    .form-input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: all var(--transition);
      outline: none;
    }

    .form-input::placeholder {
      color: var(--text-light);
    }

    .form-input:focus {
      border-color: var(--royal);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(30, 77, 183, .10);
    }

    .form-input.error {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, .08);
    }

    .form-input.success {
      border-color: var(--green);
    }

    /* Password toggle */
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color var(--transition);
      background: none;
      border: none;
    }

    .password-toggle:hover {
      color: var(--text-mid);
    }

    /* ============================================================
       FORM OPTIONS ROW
    ============================================================ */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-mid);
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      accent-color: var(--royal);
    }

    .forgot-link {
      font-size: 0.85rem;
      color: var(--royal);
      font-weight: 600;
      transition: color var(--transition);
      cursor: pointer;
      background: none;
      border: none;
    }

    .forgot-link:hover {
      color: var(--royal-light);
      text-decoration: underline;
    }

    /* ============================================================
       LOGIN BUTTON
    ============================================================ */
    .login-btn {
      width: 100%;
      padding: 16px;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--royal);
      box-shadow: 0 4px 16px rgba(30, 77, 183, .30);
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover:not(:disabled) {
      background: var(--royal-light);
      box-shadow: 0 6px 24px rgba(30, 77, 183, .40);
      transform: translateY(-1px);
    }

    .login-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Loading spinner */
    .login-btn .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .login-btn.loading .spinner {
      display: block;
    }

    .login-btn.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ============================================================
       ERROR / SUCCESS MESSAGE
    ============================================================ */
    .auth-message {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      align-items: flex-start;
      gap: 10px;
      animation: shake 0.3s ease;
    }

    .auth-message.show {
      display: flex;
    }

    .auth-message.error {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }

    .auth-message.success {
      background: var(--green-pale);
      color: #166534;
      border: 1px solid #BBF7D0;
    }

    .auth-message .msg-icon {
      flex-shrink: 0;
      font-size: 1.1rem;
      line-height: 1;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px);
      }

      75% {
        transform: translateX(4px);
      }
    }

    /* ============================================================
       FORGOT PASSWORD MODAL
    ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 22, 40, .7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      animation: fade-in 0.2s ease;
    }

    .modal-overlay.show {
      display: flex;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 36px;
      width: 100%;
      max-width: 420px;
      animation: modal-pop 0.3s cubic-bezier(.4, 0, .2, 1);
    }

    @keyframes modal-pop {
      from {
        opacity: 0;
        transform: scale(.95) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 0.88rem;
      color: var(--text-mid);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all var(--transition);
    }

    .modal-btn-cancel {
      background: var(--bg);
      color: var(--text-mid);
      border: 1.5px solid var(--border);
    }

    .modal-btn-cancel:hover {
      background: var(--border);
    }

    .modal-btn-submit {
      background: var(--royal);
      color: #fff;
      box-shadow: 0 4px 12px rgba(30, 77, 183, .25);
    }

    .modal-btn-submit:hover {
      background: var(--royal-light);
    }

    /* ============================================================
       BACK TO HOME
    ============================================================ */
    .back-home {
      text-align: center;
      margin-top: 24px;
    }

    .back-home a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, .55);
      font-weight: 500;
      transition: color var(--transition);
    }

    .back-home a:hover {
      color: rgba(255, 255, 255, .9);
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
        border-radius: var(--radius);
      }

      .login-card-title {
        font-size: 1.3rem;
      }

      .form-options {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- Background particles -->
  <div class="bg-particles" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-wrapper">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="4" fill="#F97316" />
          <path d="M11 2C11 2 5 6 5 11" stroke="white" stroke-width="2" stroke-linecap="round" />
          <path d="M11 2C11 2 17 6 17 11" stroke="white" stroke-width="2" stroke-linecap="round" />
          <path d="M2 11C2 11 6 17 11 17" stroke="white" stroke-width="2" stroke-linecap="round" />
          <path d="M20 11C20 11 16 17 11 17" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <div class="login-logo-text">
        <div class="login-logo-name">Tiranga</div>
        <div class="login-logo-sub">Cable TV & Internet</div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <h1 class="login-card-title">Welcome Back</h1>
      <p class="login-card-sub">Sign in to your account to continue</p>

      <!-- Auth Message -->
      <div id="auth-message" class="auth-message" role="alert">
        <span class="msg-icon"></span>
        <span class="msg-text"></span>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address</label>
          <div class="form-input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
            </span>
            <input type="email" id="login-email" class="form-input" placeholder="you@example.com" autocomplete="email"
              required>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <div class="form-input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password"
              autocomplete="current-password" required style="padding-right: 48px;">
            <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password" tabindex="-1">
              <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg id="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path
                  d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                <path
                  d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
                <path d="m2 2 20 20" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Options Row -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me">
            Remember me
          </label>
          <button type="button" class="forgot-link" id="forgot-password-btn">Forgot Password?</button>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn" id="login-submit-btn">
          <span class="btn-text">Sign In</span>
          <span class="spinner"></span>
        </button>
      </form>
    </div>

    <!-- Back to Home -->
    <div class="back-home">
      <a href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
        Back to Home
      </a>
    </div>

  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgot-modal" role="dialog" aria-labelledby="forgot-modal-title" aria-modal="true">
    <div class="modal-card">
      <h2 class="modal-title" id="forgot-modal-title">Reset Password</h2>
      <p class="modal-desc">Enter your email address and we'll send you a link to reset your password.</p>

      <div id="forgot-message" class="auth-message" role="alert" style="margin-bottom: 16px;">
        <span class="msg-icon"></span>
        <span class="msg-text"></span>
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label for="forgot-email" class="form-label">Email Address</label>
        <div class="form-input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
          </span>
          <input type="email" id="forgot-email" class="form-input" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn-cancel" id="forgot-cancel-btn">Cancel</button>
        <button class="modal-btn-submit" id="forgot-submit-btn">Send Reset Link</button>
      </div>
    </div>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Tiranga Auth Modules -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/guard.js"></script>

  <script>
    'use strict';

    // ── DOM Elements ──────────────────────────────────────────────
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const rememberCheckbox = document.getElementById('remember-me');
    const loginBtn = document.getElementById('login-submit-btn');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');
    const authMessage = document.getElementById('auth-message');

    // Forgot password elements
    const forgotModal = document.getElementById('forgot-modal');
    const forgotBtn = document.getElementById('forgot-password-btn');
    const forgotCancelBtn = document.getElementById('forgot-cancel-btn');
    const forgotSubmitBtn = document.getElementById('forgot-submit-btn');
    const forgotEmailInput = document.getElementById('forgot-email');
    const forgotMessage = document.getElementById('forgot-message');

    // ── Check if already logged in ────────────────────────────────
    (async function checkAuth() {
      const redirected = await TirangaGuard.redirectIfAuthenticated();
      if (!redirected) {
        // Show the login form (it's already visible, but this is a safety measure)
        document.querySelector('.login-wrapper').style.opacity = '1';
      }
    })();

    // ── Restore remembered email ──────────────────────────────────
    const rememberedEmail = localStorage.getItem(TIRANGA_CONFIG.REMEMBER_ME_KEY);
    if (rememberedEmail === 'true') {
      rememberCheckbox.checked = true;
    }

    // ── Show/Hide Password ────────────────────────────────────────
    togglePasswordBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.style.display = isPassword ? 'none' : 'block';
      eyeOffIcon.style.display = isPassword ? 'block' : 'none';
      this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    // ── Show Message ──────────────────────────────────────────────
    function showMessage(element, type, text) {
      element.className = 'auth-message show ' + type;
      element.querySelector('.msg-icon').textContent = type === 'error' ? '⚠️' : '✅';
      element.querySelector('.msg-text').textContent = text;
    }

    function hideMessage(element) {
      element.className = 'auth-message';
    }

    // ── Login Form Submit ─────────────────────────────────────────
    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      hideMessage(authMessage);

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const rememberMe = rememberCheckbox.checked;

      // Basic validation
      if (!email) {
        showMessage(authMessage, 'error', 'Please enter your email address.');
        emailInput.classList.add('error');
        emailInput.focus();
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(authMessage, 'error', 'Please enter a valid email address.');
        emailInput.classList.add('error');
        emailInput.focus();
        return;
      }

      if (!password) {
        showMessage(authMessage, 'error', 'Please enter your password.');
        passwordInput.classList.add('error');
        passwordInput.focus();
        return;
      }

      // Set loading state
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      // Authenticate
      const result = await TirangaAuth.login(email, password, rememberMe);

      if (!result.success) {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
        showMessage(authMessage, 'error', result.error);
        passwordInput.value = '';
        passwordInput.focus();
        return;
      }

      // Login successful — fetch role and redirect
      showMessage(authMessage, 'success', 'Login successful! Redirecting...');

      const profile = await TirangaRoles.getProfile(result.user.id);
      const role = profile ? profile.role : 'customer';

      // Check for redirect param in URL
      const urlParams = new URLSearchParams(window.location.search);
      const redirectParam = urlParams.get('redirect');

      if (redirectParam) {
        window.location.href = redirectParam;
      } else {
        window.location.href = TirangaRoles.getRedirectForRole(role);
      }
    });

    // ── Clear error state on input ────────────────────────────────
    emailInput.addEventListener('input', function () {
      this.classList.remove('error');
    });

    passwordInput.addEventListener('input', function () {
      this.classList.remove('error');
    });

    // ── Forgot Password Modal ─────────────────────────────────────
    forgotBtn.addEventListener('click', function () {
      forgotModal.classList.add('show');
      forgotEmailInput.value = emailInput.value;
      hideMessage(forgotMessage);
      setTimeout(() => forgotEmailInput.focus(), 100);
    });

    forgotCancelBtn.addEventListener('click', function () {
      forgotModal.classList.remove('show');
    });

    forgotModal.addEventListener('click', function (e) {
      if (e.target === forgotModal) {
        forgotModal.classList.remove('show');
      }
    });

    // Close modal on Escape
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && forgotModal.classList.contains('show')) {
        forgotModal.classList.remove('show');
      }
    });

    forgotSubmitBtn.addEventListener('click', async function () {
      const email = forgotEmailInput.value.trim();

      if (!email || !isValidEmail(email)) {
        showMessage(forgotMessage, 'error', 'Please enter a valid email address.');
        return;
      }

      forgotSubmitBtn.disabled = true;
      forgotSubmitBtn.textContent = 'Sending...';

      const result = await TirangaAuth.resetPassword(email);

      forgotSubmitBtn.disabled = false;
      forgotSubmitBtn.textContent = 'Send Reset Link';

      if (result.success) {
        showMessage(forgotMessage, 'success', 'Password reset link has been sent to your email.');
      } else {
        showMessage(forgotMessage, 'error', result.error);
      }
    });

    // ── Email Validation ──────────────────────────────────────────
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // ── Keyboard: Enter to submit in password field ───────────────
    passwordInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        loginForm.dispatchEvent(new Event('submit'));
      }
    });
  </script>

</body>

</html>
